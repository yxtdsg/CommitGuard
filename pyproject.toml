[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commitguard"
version = "1.0.0"
description = "Pre-commit birth review for robust multi-object tracking"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "lap==0.5.13",
  "cython-bbox==0.1.5",
  "torch>=2.5"
]

[project.optional-dependencies]
eval = ["trackeval==1.3.0"]
plot = ["matplotlib>=3.8", "Pillow>=10"]
baselines = ["opencv-python>=4.9", "PyYAML>=6"]

[project.scripts]
commitguard-run = "commitguard.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
